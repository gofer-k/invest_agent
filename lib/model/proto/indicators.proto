syntax = "proto3";

package trading.indicators;
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Maps to lib/model/indicator_schema.dart: IndicatorType
enum IndicatorType {
  UNDEFINED = 0;
  PRICE = 1;
  BOLLINGER_BANDS = 2;
  SMA = 3;
  EMA = 4;
  MACD = 5;
  RSI = 6;
  VOLUME = 7;
  KST = 8;
  ROC = 9;
}

// Maps to lib/model/price_result.dart: IndexPriceItem
message IndexPriceItem {
  int32 id = 1;
  int32 asset_id = 2;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
  double volume = 7;
  google.protobuf.Timestamp date_time = 8;
}


// Maps to lib/model/indicator_schema.dart: Indicator
message Indicator {
  int32 id = 1;
  string name = 2;
  IndicatorType type = 3;
  // Dynamic parameters (Map<String, dynamic>)
  google.protobuf.Struct parameters = 4;
}

// Represents List<BaseIndicatorResult>
message IndicatorResultList {
  repeated IndicatorSeries items = 1;
}

// Represents a single BaseIndicatorResult (e.g., a specific SMA series)
message IndicatorSeries {
  string chart_style = 1; // Maps to ChartStyle enum name
  Indicator config = 2;
  repeated IndicatorPoint points = 3;
}

// Represents a single point in the series (BaseIndicatorValue)
message IndicatorPoint {
  google.protobuf.Timestamp date_time = 1;
  // Flexible map for varied results:
  // e.g., {"mean": 150.0, "std": 2.5} for SMA, or {"value": 70.0} for RSI
  map<string, double> values = 2;
}