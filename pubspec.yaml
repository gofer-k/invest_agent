name: invest_agent
description: "A ETF technical analysis Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  flutter_secure_storage: ^10.0.0
  file_picker: ^10.3.8
  flutter_math_fork: ^0.7.4
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  dart_duckdb: ^1.4.4
  sealed_currencies: ^3.0.1
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  cupertino_icons: ^1.0.8
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.9
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_lints: ^6.0.0

dependency_overrides:
  vector_math: ^2.2.0

flutter:
  uses-material-design: true
